servers:
  - url: '{apiRoot}/qa-assistant-service/vwip'
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Query
    description: Q&A assistant query operations
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/ModelAsAService
paths:
  /answer:
    post:
      operationId: queryAssistant
      summary: Get an answer from a QA assistant
      description: |
        Queries a configured QA assistant to generate answers using knowledge bases and LLMs.

        **Tool usage during answer generation:**
        If the assistant has tools associated via `toolIds` (see `qa-assistant-manage`),
        the platform's LLM MAY invoke those tools automatically while generating the
        answer, turning the assistant into an agent that can take actions to ground or
        enrich its responses. Whether and which tools are invoked is decided by the LLM
        at query time based on the prompt and the assistant configuration. Tool
        invocation details (whether any tool was called, which ones, with what arguments
        and results) are NOT surfaced in the `QueryResponse` in this API version;
        callers requiring that visibility should use the `callTool` endpoint on the
        `knowledge-base` API to execute tools directly. A tool failure during answer
        generation is handled by the platform and does not change the HTTP status of
        `queryAssistant` (always 200); it may be reflected in the `finished` value
        (e.g. `ERROR`).

        **Security note:** LLM-initiated tool invocations cause the API provider's server
        to send outbound HTTP requests to the consumer-registered tool URLs. The SSRF
        protections that the provider MUST enforce for such outbound calls are documented
        in the "Security considerations" section of the `knowledge-base` API, which owns
        tool registration and invocation.

        **Key Features:**
        - Utilizes pre-configured assistant settings (prompts, model parameters)
        - Leverages associated knowledge bases for contextual responses (only documents with indexing `status` = `READY` in those knowledge bases participate in answer generation; see the `Document` schema on the `knowledge-base` API)
        - Provides termination status for answer generation

        **Key Rules:**
        - Requires valid UUID `assistantId`
        - `prompt` must be 1-1000 characters
        - Needs `qa-assistant-service:answer:read` scope
        - Assistant must be properly configured and accessible

        **Response Characteristics:**
        - **200 OK**: Returns `QueryResponse` with answer text and termination status. The HTTP status is always 200 for every business outcome; `success` and `finished` together express the outcome (see the `QueryResponse` schema description for the full mapping).
          - `finished` indicates generation completion reason (STOP / LENGTH / ERROR / FILTER), and `success` is its boolean summary (true for STOP/LENGTH, false for ERROR/FILTER).
          - `answerText` carries the answer when `success=true`, and is empty or a short diagnostic string when `success=false`.
          - `reference` shows knowledge base source when available
        - **400 Bad Request**:
          - Missing/invalid prompt
          - Invalid assistantId format
          - Prompt length exceeds limits
        - **401 Unauthenticated**: Missing/invalid credentials
        - **403 Forbidden**:
          - Missing required scope
          - Token/assistantId mismatch
        - **404 Not Found**:
          - Assistant doesn't exist
          - Identifier not found
        - **500 Internal Server Error**:
          - LLM processing failure
          - Knowledge base access error
      tags:
        - Query
      parameters:
        - $ref: '../common/CAMARA_common.yaml#/components/parameters/x-correlator'
      security:
        - openId:
            - qa-assistant-service:answer:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Successful answer retrieval
          headers:
            x-correlator:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '../common/CAMARA_common.yaml#/components/responses/Generic400'
        '401':
          $ref: '../common/CAMARA_common.yaml#/components/responses/Generic401'
        '403':
          $ref: '../common/CAMARA_common.yaml#/components/responses/Generic403'
        '404':
          $ref: '../common/CAMARA_common.yaml#/components/responses/Generic404'
        '500':
          $ref: '../common/CAMARA_common.yaml#/components/responses/Generic500'
components:
  securitySchemes:
    openId:
      $ref: '../common/CAMARA_common.yaml#/components/securitySchemes/openId'
  schemas:
    QueryRequest:
      type: object
      description: Request payload for querying a QA assistant
      required:
        - assistantId
        - prompt
      additionalProperties: false
      properties:
        assistantId:
          type: string
          format: uuid
          maxLength: 36
          description: Unique identifier of the QA assistant to query
          example: a1b2c3d4-5678-90ab-cdef-1234567890ab
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
          description: The user's question or query to send to the assistant
          example: How do I reset my password?
    QueryResponse:
      type: object
      description: |
        Response payload containing the assistant's generated answer.

        `success` and `finished` together express the business outcome of the query, per the CAMARA API Design Guide §3.1.2 (explicit documentation of how a business outcome is represented in a successful response). They are not independent: `success` is a boolean summary and `finished` is the machine-readable reason, and the two MUST agree:

        | `finished` | `success` | Meaning |
        |---|---|---|
        | `STOP` | `true` | Generation completed normally; `answerText` holds the answer. |
        | `LENGTH` | `true` | Generation completed but was truncated to fit the token limit; `answerText` holds the (truncated) answer. |
        | `ERROR` | `false` | Generation failed (e.g. LLM processing failure, knowledge base access error, or an unrecoverable tool failure during answer generation); `answerText` is empty or contains a short platform-supplied diagnostic string. |
        | `FILTER` | `false` | The generated answer was blocked by a content filter; `answerText` is empty or contains a short platform-supplied explanation. |

        The HTTP status of `queryAssistant` is always `200` for every value of `finished`; `success=false` does NOT change the HTTP status. A tool failure during answer generation is handled by the platform and reflected in `finished=ERROR` (see the `queryAssistant` operation description), not as an HTTP error.
      required:
        - success
        - finished
        - answerText
      properties:
        success:
          type: boolean
          description: |
            Boolean summary of the query outcome, paired with `finished`. `true` only when `finished` is `STOP` or `LENGTH` (an answer was produced); `false` when `finished` is `ERROR` or `FILTER`. The two fields MUST be consistent - see the schema-level description for the full mapping.
        finished:
          type: string
          maxLength: 32
          description: |
            Machine-readable termination status of the answer generation, per CAMARA API Design Guide §3.1.2. The enum carries the reason that generation stopped, and is the authoritative outcome field that `success` summarises:
            - `STOP` - normal completion (success=true).
            - `LENGTH` - the answer was truncated to fit the token limit (success=true).
            - `ERROR` - generation failed (success=false).
            - `FILTER` - the answer was blocked by a content filter (success=false).
          enum:
            - STOP
            - LENGTH
            - ERROR
            - FILTER
          example: STOP
        answerText:
          type: string
          maxLength: 65535
          description: |
            The assistant's generated answer text. When `success` is `true` (`finished` = `STOP` or `LENGTH`), this holds the (possibly truncated) answer. When `success` is `false` (`finished` = `ERROR` or `FILTER`), this is either an empty string or a short platform-supplied diagnostic/explanation string; it MUST NOT be treated as a valid answer.
          example: To reset your password, go to settings > security...
        reference:
          type: string
          maxLength: 255
          description: Optional reference identifier to the knowledge base source used for the answer
          example: kb123_section5
